<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D1T7 - Pseudo</title>
    <link rel="stylesheet" href="pseudo.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="#home">Home</a> <br /><br />
        <a href="#about">About</a> <br /><br />
        <a href="#services">Services</a> <br /><br />
        <a href="#contact">Contact</a> <br /><br />
      </nav>
    </header>
    <main>
      <section id="home">
        <h1>Home</h1>
      </section>
      <section id="about">
        <h2>About</h2>
      </section>
      <section id="services">
        <h2>Services</h2>
      </section>
      <section id="contact">
        <h2>Contact</h2>
      </section>

      <h3>Custom checkbox</h3>
      <input type="checkbox" name="chbox" id="chbox" />
      <label for="chbox" class="checkmark">Subscribe</label>

      <h3>Custom numered list using CSS Counter</h3>
      <ol>
        <li>Apple</li>
        <li>Mango</li>
        <li>Orange</li>
      </ol>
      <ol>
        <li>Red</li>
        <li>Yellow</li>
        <li>Orange</li>
      </ol>

      <h3>Tooltip</h3>
      <div class="tooltip" data-tooltip="This is the tooltip information">
        Hover over me
      </div>
    </main>
  </body>
</html>
