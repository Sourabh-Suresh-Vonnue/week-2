<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D2T2 - Flexbox Item</title>
    <link rel="stylesheet" href="flexbox-item.css" />
  </head>
  <body>
    <main>
      <h1>flex-grow</h1>
      <div class="container">
        <div id="flex-grow-item1">1</div>
        <div id="flex-grow-item2">2</div>
        <div id="flex-grow-item3">3</div>
        <div id="flex-grow-item4">4</div>
        <div id="flex-grow-item5">5</div>
      </div>
      <h1>flex-shrink</h1>
      <div class="container">
        <div id="flex-shrink-item1">1</div>
        <div id="flex-shrink-item2">2</div>
        <div id="flex-shrink-item3">3</div>
        <div id="flex-shrink-item4">4</div>
        <div id="flex-shrink-item5">5</div>
      </div>
      <h1>flex-basis</h1>
      <div class="container">
        <div id="flex-basis-item1">1</div>
        <div id="flex-basis-item2">2</div>
        <div id="flex-basis-item3">3</div>
        <div id="flex-basis-item4">4</div>
        <div id="flex-basis-item5">5</div>
      </div>
      <h1>order</h1>
      <div class="container">
        <div id="order-item1">1</div>
        <div id="order-item2">2</div>
        <div id="order-item3">3</div>
        <div id="order-item4">4</div>
        <div id="order-item5">5</div>
      </div>
      <h1>align-self</h1>
      <div class="container" id="align-self-container">
        <div id="align-self-item1">1</div>
        <div id="align-self-item2">2</div>
        <div id="align-self-item3">3</div>
        <div id="align-self-item4">4</div>
        <div id="align-self-item5">5</div>
      </div>
    </main>
  </body>
</html>
