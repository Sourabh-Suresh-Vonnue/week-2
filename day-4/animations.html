<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D4T4 - Animations</title>
    <link rel="stylesheet" href="animations.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body>
    <main>
      <h1>Animations</h1>
      <h2>Spinner loading</h2>
      <div class="spinner"></div>
      <h2>Skeleton loading</h2>
      <div class="skeleton">
        <div class="image"></div>
        <div class="desc"></div>
      </div>
      <h2>Card entry</h2>
      <div class="card">
        <h3>Title</h3>
        <p>
          Lorem ipsum dolor, sit amet consectetur adipisicing elit. Harum
          tenetur, placeat omnis at aliquam itaque soluta ipsum, dolore, quod
          sit suscipit optio accusamus? A sapiente odio ut omnis reprehenderit
          iusto.
        </p>
      </div>
      <h2>Notification Bell</h2>
      <div class="notification">
        <i class="fa fa-bell" id="bell"></i>
      </div>
    </main>
  </body>
</html>
