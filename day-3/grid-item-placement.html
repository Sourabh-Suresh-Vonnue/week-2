<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D3T1 - Grid Item Placement</title>
    <link rel="stylesheet" href="grid-item-placement.css" />
  </head>
  <body>
    <main>
      <h1>Grid item Placement</h1>
      <h2>Line-based</h2>
      <div class="grid-container">
        <div class="item item1">Item 1</div>
        <div class="item item2">Item 2</div>
        <div class="item item3">Item 3</div>
        <div class="item item4">Item 4</div>
        <div class="item item5">Item 5</div>
        <div class="item item6">Item 6</div>
        <div class="item item7">Item 7</div>
        <div class="item item8">Item 8</div>
      </div>
      <h2>grid-auto-flow: dense</h2>
      <p>without dense</p>
      <div class="grid-container gaf-non-dense">
        <div class="item dense-item1">Item 1</div>
        <div class="item dense-item2">Item 2</div>
        <div class="item dense-item3">Item 3</div>
        <div class="item dense-item4">Item 4</div>
        <div class="item dense-item5">Item 5</div>
        <div class="item dense-item6">Item 6</div>
        <div class="item dense-item7">Item 7</div>
        <div class="item dense-item8">Item 8</div>
      </div>
      <p>with dense</p>
      <div class="grid-container gaf-dense">
        <div class="item dense-item1">Item 1</div>
        <div class="item dense-item2">Item 2</div>
        <div class="item dense-item3">Item 3</div>
        <div class="item dense-item4">Item 4</div>
        <div class="item dense-item5">Item 5</div>
        <div class="item dense-item6">Item 6</div>
        <div class="item dense-item7">Item 7</div>
        <div class="item dense-item8">Item 8</div>
      </div>
    </main>
  </body>
</html>
